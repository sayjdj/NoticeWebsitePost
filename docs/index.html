<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시글 통합 알림 서비스</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">
    <div class="max-w-4xl mx-auto p-4 sm:p-6 lg:p-8">
        <header class="mb-8 text-center sm:text-left flex flex-col sm:flex-row justify-between items-center">
            <div>
                <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight">최신 게시글 모아보기</h1>
                <p class="mt-2 text-sm text-gray-500">지정된 웹사이트의 최신 업데이트를 확인하세요.</p>
            </div>
            <div class="mt-4 sm:mt-0 px-4 py-2 bg-blue-50 text-blue-700 font-medium rounded-full text-sm inline-flex items-center" id="last-updated">
                업데이트 확인 중...
            </div>
        </header>

        <div class="mb-6">
            <label for="site-filter" class="block text-sm font-medium text-gray-700 mb-2">사이트 필터</label>
            <select id="site-filter" class="block w-full sm:w-64 pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm rounded-md shadow-sm border">
                <option value="all">모든 사이트</option>
            </select>
        </div>

        <div id="posts-container" class="grid gap-6 grid-cols-1 md:grid-cols-2">
            <!-- Posts will be rendered here -->
            <div class="col-span-full text-center py-10 text-gray-500" id="loading-state">
                <i class="fas fa-spinner fa-spin text-3xl mb-3"></i>
                <p>데이터를 불러오는 중입니다...</p>
            </div>
        </div>

        <div id="empty-state" class="hidden text-center py-12 bg-white rounded-lg shadow-sm border border-gray-200">
            <i class="far fa-folder-open text-4xl text-gray-400 mb-3"></i>
            <h3 class="text-lg font-medium text-gray-900">게시글이 없습니다</h3>
            <p class="mt-1 text-sm text-gray-500">선택한 조건에 맞는 게시글을 찾을 수 없습니다.</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
